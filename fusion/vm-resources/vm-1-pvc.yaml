---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-1-pvc
  labels:
    appname: fedora-vm
spec:
  dataSourceRef:
    apiGroup: cdi.kubevirt.io
    kind: VolumeImportSource
    name: cirros-source
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 512Mi
  storageClassName: san-lg1-vm

