apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-writer-mysql
  labels:
    io: io-writer-mysql
    appname: mysql_app_1
spec:
  replicas: 5
  selector:
    matchLabels:
      io: io-writer-mysql
  template:
    metadata:
      labels:
        io: io-writer-mysql
    spec:
      initContainers:
      - name: init-mysqlservice
        image: quay.io/ocsci/busybox:release-4.22
        command: ['sh', '-c', "until nslookup mysql.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mysql service; sleep 2; done"]
      containers:
      - name: mysql
        image: quay.io/ocsci/mysql_data_write:release-4.22
        command: ['/usr/bin/python3', '/script/db.py']
        imagePullPolicy: Always
        env:
         - name: MYSQL_DB_HOST
           value: mysql
         - name: MYSQL_DB_USER
           value: root
         - name: MYSQL_DB_PASSWORD
           valueFrom:
             secretKeyRef:
               name: mysqlsecret
               key: mysqldbpass
