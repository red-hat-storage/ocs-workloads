resources:
- ../../../base
patches:
  - target:
      labelSelector: appname=mysql_app_1
    patch: |-
      - op: replace
        path: /metadata/labels/appname
        value: mysql_app_3
  - target:
      kind: PersistentVolumeClaim
      labelSelector: appname=mysql_app_1
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteMany
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-cephfs
      - op: replace
        path: /metadata/labels/appname
        value: mysql_app_3
  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /metadata/name
        value: mysql-cephfs
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: mysql-pv-claim-cephfs
  - target:
      kind: PersistentVolumeClaim
      name: mysql-pv-claim
    patch: |-
      - op: replace
        path: /metadata/name
        value: mysql-pv-claim-cephfs