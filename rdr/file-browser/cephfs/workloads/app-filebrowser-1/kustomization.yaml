resources:
- ../../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      labelSelector: appname=firebrowser_app1
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteMany
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-cephfs
  - target:
      kind: Deployment
      name: filebrowser
    patch: |-
      - op: replace
        path: /metadata/name
        value: filebrowser-cephfs
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: filebrowser-pvc-1-cephfs
  - target:
      kind: PersistentVolumeClaim
      name: filebrowser-pvc-1
    patch: |-
      - op: replace
        path: /metadata/name
        value: filebrowser-pvc-1-cephfs
