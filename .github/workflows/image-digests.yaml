name: "Refresh Image Digests"

# Refresh the pinned image digests in rdr/ kustomization images: blocks.
# Re-resolves each `newTag` to its current manifest-list digest and, if anything
# changed, opens a PR back against the SAME branch it ran on. Merging that PR is
# a deliberate, reviewable "adopt the newer builds" action.
#
# Branch model:
#   - schedule (nightly) only ever runs on the default branch (master), where
#     newTag: latest -> pins track the newest builds.
#   - release-* branches are frozen by design and get NO automatic runs. To
#     deliberately re-pin a release branch (e.g. a workload security fix),
#     manually dispatch this workflow with that branch selected; it resolves
#     from that branch's newTag (release-X) and opens a PR against it.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily (default branch only)
  workflow_dispatch: {}   # manual: pick any branch (e.g. a release-* branch)

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-digests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo and yq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          skopeo --version
          yq --version

      - name: Refresh digests
        run: hack/update_digests.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          # Open the PR back against whatever branch this run was triggered on,
          # and namespace the bot branch per base so branches don't collide.
          branch: bot/image-digests-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          commit-message: "chore: refresh pinned image digests (${{ github.ref_name }})"
          title: "chore: refresh pinned image digests (${{ github.ref_name }})"
          body: |
            Automated refresh of pinned container image digests in `rdr/`
            kustomization `images:` blocks on `${{ github.ref_name }}`.

            Each `newTag` was re-resolved to its current manifest-list digest via
            `hack/update_digests.sh`. Review the digest changes before merging —
            merging adopts the newer builds on this branch.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: |
            automated
            image-digests
          delete-branch: true
